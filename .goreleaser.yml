version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

# Keyless signing via Sigstore/cosign — always runs in GitHub Actions using the
# OIDC token. Produces a .sig and .pem (certificate) alongside the checksum file.
# Verifiable with: cosign verify-blob --bundle <artifact>.bundle <artifact>
cosigns:
  - artifacts: checksum
    output: true

# GPG signing of the checksum — required for Terraform Registry publication.
# Only runs when GPG_FINGERPRINT is set (i.e., secrets.GPG_PRIVATE_KEY is configured).
# Pass --skip=sign to goreleaser when no GPG key is available.
signs:
  - cmd: gpg
    artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  draft: false
  footer: |
    Generated by [sync workflow](https://github.com/fabiendupont/terraform-provider-nvidia-infra-controller/actions/workflows/sync.yml) from the NVIDIA Infra Controller OpenAPI spec.

changelog:
  disable: true
